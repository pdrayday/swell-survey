<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lovely Taste Panel</title>
<meta name="description" content="A 5-minute survey to help shape Lovely before launch.">
<meta name="theme-color" content="#f4cddb">
<meta name="color-scheme" content="only light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,600..800;1,8..60,500..700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<script>
/* ============================================================
   CONFIG: paste your Google Apps Script web-app URL here so every
   response lands in your Google Sheet (see apps-script.gs).
   Leave it empty and the survey runs in preview mode.
   ============================================================ */
window.SWELL_ENDPOINT = "https://script.google.com/macros/s/AKfycbyG63E6rQyNNm7RpyvNEzb_tDDFTg8poEKbz4qLGE8Y2mnReOEba0SrNwOf5J2soQKm/exec";
</script>
<style>
:root{
  color-scheme: only light;
  --bg:#f4cddb; --bg-2:#efc2d3; --surface:#efc0d1; --surface-2:#ecb8cb;
  --fg:#7d4558; --muted:#874f62; --line:rgba(255,255,255,.7);
  --ink:#fff; --ink-2:#fff5f8; --on-ink:#c9577f; --pink:#c9577f; --stage:#f7d6e2;
  --card:#fff7fa; --sel:#c9577f;
  --blue:#b9cdee; --blue-ink:#2f5aa8;
  --display:"Source Serif 4","Source Serif Pro",Georgia,serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.55 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;height:auto;display:block}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.06;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 em,h2 em,h3 em{font-style:italic;font-weight:600;color:#fff}
p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding-inline:clamp(16px,4vw,32px)}
:focus-visible{outline:2.5px solid #fff;outline-offset:3px;border-radius:10px}

/* header + section tabs (deck-style) */
body::before{content:"";position:fixed;z-index:60;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(244,205,219,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;height:64px;padding-inline:clamp(14px,3vw,28px)}
.logo{flex:none;display:flex}.logo img{height:40px;width:auto;filter:brightness(0) invert(1)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;color:#fff;font:600 15px/1 var(--body);padding:10px 14px;border-radius:999px;white-space:nowrap;cursor:pointer;opacity:.62;transition:background .2s,color .2s,opacity .2s}
.tabs button.done{opacity:.95}
.tabs button.on{background:#fff;color:var(--pink);opacity:1}
.tabs button:disabled{cursor:default}
.prog{height:3px;background:rgba(255,255,255,.35)}.prog i{display:block;height:100%;width:0;background:#fff;transition:width .5s cubic-bezier(.22,1,.36,1)}
@media (max-width:700px){.tabs{display:none}.top .count{margin-left:auto}}
.count{flex:none;font:600 13.5px/1 var(--body);color:#fff;opacity:.9;white-space:nowrap}

/* screens */
main{padding-block:clamp(26px,5vw,56px) 40px}
.screen{animation:in .45s cubic-bezier(.22,1,.36,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.kick{font:700 12.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:.9;margin-bottom:12px}
.sh{display:grid;gap:12px;margin-bottom:26px}
.sh h2{font-size:clamp(34px,5vw,54px)}
.sh p{color:var(--muted);font-size:18px;max-width:36em}

/* hero / welcome */
.hero{display:grid;gap:26px}
.hero h1{font-size:clamp(46px,7.4vw,84px)}
.hero .lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:32em}
.stage{border-radius:28px;background:radial-gradient(ellipse 80% 70% at 50% 35%,#fff 0%,var(--stage) 72%);overflow:hidden}
.hero .stage img{width:100%}
.hero .stage.lineup{display:flex;justify-content:center;align-items:flex-end;gap:clamp(4px,1.5vw,14px);padding:34px 12px 0}
.hero .stage.lineup img{height:clamp(170px,30vw,300px);width:auto}
.hero .stage.lineup img:nth-child(3){height:clamp(195px,34vw,340px)}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.facts span{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--surface);font:600 14px/1 var(--body)}
.facts span::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}

/* question card */
.q{background:var(--card);border-radius:24px;padding:clamp(18px,3vw,28px);margin-bottom:16px;box-shadow:0 18px 40px -30px rgba(80,20,40,.45);scroll-margin-top:90px;transition:box-shadow .25s}
.q.err{box-shadow:0 0 0 2.5px var(--pink),0 18px 40px -30px rgba(80,20,40,.45)}
.q .qt{font:700 clamp(19px,2.1vw,23px)/1.25 var(--display);letter-spacing:-.01em;color:#5e2f40}
.q .qh{font-size:14.5px;color:var(--muted);margin-top:6px}
.q .qb{margin-top:16px}
.q .req{color:var(--pink)}
.q .em{font:600 13.5px var(--body);color:var(--pink);margin-top:10px}
.num{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:10px;border-radius:50%;background:var(--bg);color:#fff;font:700 13px/1 var(--body);vertical-align:3px}

/* choice pills */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.opts.wide{grid-template-columns:1fr}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:13px 16px;border-radius:16px;border:2px solid transparent;background:#fbe6ee;cursor:pointer;font:500 15.5px/1.3 var(--body);color:#5e2f40;transition:transform .35s var(--spring),border-color .2s,background .2s;-webkit-tap-highlight-color:transparent}
.opt:hover{background:#f8dce7}
.opt:active{transform:scale(.97);transition-duration:.08s}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #e6a9bf;background:#fff;transition:border .25s var(--spring)}
.opt.multi .dot{border-radius:6px;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--sel);background:#fff}
.opt[aria-pressed="true"] .dot{border:6px solid var(--sel)}
.opt.multi[aria-pressed="true"] .dot{border:0;background:var(--sel)}
.opt.multi[aria-pressed="true"] .dot::after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.other{margin-top:8px}

/* scales */
.scale{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.scale button{border:2px solid transparent;background:#fbe6ee;border-radius:12px;padding:12px 0;font:700 16px/1 var(--body);color:#5e2f40;cursor:pointer;transition:transform .3s var(--spring),background .2s,color .2s}
.scale button:active{transform:scale(.9)}
.scale button[aria-pressed="true"]{background:var(--sel);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px;gap:12px}
@media (max-width:520px){.scale.n11{grid-template-columns:repeat(6,minmax(0,1fr))}.scale.n11 + .ends{display:none}}

/* matrix */
.mx{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:#fbe6ee}
.mrow b{font-weight:600;font-size:15.5px;color:#5e2f40}.mrow small{display:block;color:var(--muted);font-size:12.5px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:#fff}
.seg button{border:0;background:none;padding:8px 12px;border-radius:999px;font:600 13px/1 var(--body);color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--sel);color:#fff}
.mrow.miss{box-shadow:inset 0 0 0 2px var(--pink)}
@media (max-width:620px){.mrow{grid-template-columns:1fr}.seg{width:100%}.seg button{flex:1;padding-inline:4px}}

/* text */
input[type=text],input[type=email],input[type=number],textarea{width:100%;border:2px solid #f3cfdc;background:#fff;border-radius:16px;padding:14px 16px;font:500 16px/1.4 var(--body);color:#5e2f40;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--sel)}
textarea{min-height:110px;resize:vertical}
.sel{width:100%;border:2px solid #f3cfdc;background:#fff;border-radius:16px;padding:14px 16px;font:600 16px/1.4 var(--body);color:#5e2f40;outline:none;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#c9577f 50%),linear-gradient(135deg,#c9577f 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 16px) 52%;background-size:6px 6px;background-repeat:no-repeat}
.sel:focus{border-color:var(--sel)}
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.money label{display:grid;gap:6px;padding:12px;border-radius:16px;background:#fbe6ee;font:600 14.5px/1.3 var(--body);color:#5e2f40}
.money .in{position:relative}.money .in span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted)}
.money input{padding-left:44px}
@media (max-width:560px){.money{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:0;background:#fbe6ee;color:#5e2f40;border-radius:999px;padding:8px 12px;font:600 13.5px/1 var(--body);cursor:pointer}
.chips button:active{transform:scale(.95)}

/* image picks */
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.picks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pick{position:relative;display:grid;grid-template-rows:auto auto;border:3px solid transparent;border-radius:20px;background:#fff;padding:0;overflow:hidden;cursor:pointer;text-align:left;transition:transform .35s var(--spring),border-color .2s,box-shadow .2s;box-shadow:0 10px 24px -20px rgba(80,20,40,.6)}
.pick:hover{transform:translateY(-3px)}.pick:active{transform:scale(.97)}
.pick .pi{height:190px;display:grid;place-items:center;padding:12px;background:#fff}
.pick .pi img{max-height:166px;width:auto;max-width:100%;object-fit:contain}
.pick .pi.duo{display:flex;align-items:flex-end;justify-content:center;gap:4px}
.pick .pi.duo img{max-height:160px}
.pick .pi.duo img+img{max-height:176px}
.pick .pl{padding:10px 14px 12px;font:700 15px/1.2 var(--body);color:#5e2f40;background:#fbe6ee}
.pick[aria-pressed="true"]{border-color:var(--sel);box-shadow:0 14px 30px -18px rgba(201,87,127,.7)}
.pick .ck{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--sel);display:grid;place-items:center;opacity:0;transform:scale(.4);transition:transform .35s var(--spring),opacity .2s}
.pick[aria-pressed="true"] .ck{opacity:1;transform:none}
.ck::after{content:"";width:12px;height:6px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

/* spec (blind ingredient) cards */
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.specs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.specs{grid-template-columns:1fr}}
.spec{position:relative;border:3px solid transparent;border-radius:20px;background:#fff;padding:16px 16px 14px;text-align:left;cursor:pointer;display:grid;gap:8px;align-content:start;transition:transform .35s var(--spring),border-color .2s;box-shadow:0 10px 24px -20px rgba(80,20,40,.6)}
.spec:active{transform:scale(.97)}
.spec h4{margin:0;font:700 22px/1 var(--display);color:#5e2f40}
.spec dl{margin:0;display:grid;gap:6px}
.spec dl div{display:grid;grid-template-columns:86px 1fr;gap:8px;font-size:13.5px;line-height:1.3;padding-top:6px;border-top:1px solid #f6dde6}
.spec dt{color:var(--muted);font-weight:600}.spec dd{margin:0;color:#5e2f40;font-weight:600}
.spec[aria-pressed="true"]{border-color:var(--sel)}
.spec[aria-pressed="true"] .ck{opacity:1;transform:none}
.spec .ck{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--sel);display:grid;place-items:center;opacity:0;transform:scale(.4);transition:transform .35s var(--spring),opacity .2s}

/* showcase blocks */
.show{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.show.one{grid-template-columns:1fr}
.show .stage{display:grid;place-items:center;padding:20px}
.show .stage.blue{background:radial-gradient(ellipse 80% 70% at 50% 35%,#fff 0%,#dbe6f7 72%)}
.show .stage img{max-height:300px;width:auto}
.show figcaption{text-align:center;font:700 15px/1.3 var(--body);margin-top:10px;color:#5e2f40}
.show figure{margin:0;display:grid;justify-items:center}
.photo{border-radius:28px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(40,10,20,.45)}
.photo img{width:100%}
.concept{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:stretch;margin-bottom:18px}
.concept .phones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.concept .phones img{border-radius:20px;box-shadow:0 20px 40px -24px rgba(40,10,20,.5)}
@media (max-width:700px){.concept{grid-template-columns:1fr}.show{grid-template-columns:1fr 1fr}}
.how{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;counter-reset:h}
.how li{counter-increment:h;position:relative;padding:14px 14px 14px 52px;border-radius:16px;background:var(--surface);font-size:15px;line-height:1.35}
.how li b{display:block;color:#5e2f40}
.how li::before{content:counter(h);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--pink);font:700 13px/1 var(--body)}
@media (max-width:560px){.how{grid-template-columns:1fr}}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.plan{background:#fff;border-radius:18px;padding:16px;display:grid;gap:4px;align-content:start;box-shadow:0 10px 24px -20px rgba(80,20,40,.6)}
.plan span{font:700 11.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}
.plan b{font:700 21px/1.15 var(--display);color:#5e2f40}
.plan p{font-size:14.5px;color:var(--muted);line-height:1.4}
@media (max-width:700px){.plans{grid-template-columns:1fr}}
.note{background:var(--surface);border-radius:18px;padding:16px 18px;font-size:15px;margin-bottom:18px}
.note b{color:#5e2f40}

/* nav buttons */
.navb{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 16px/1 var(--body);padding:17px 28px;border-radius:999px;border:0;background:var(--ink);color:var(--on-ink);cursor:pointer;transition:transform .35s var(--spring),background .2s;-webkit-tap-highlight-color:transparent;text-decoration:none}
.btn:hover{background:var(--ink-2)}
.btn:active{transform:scale(.94);transition-duration:.08s}
.btn.alt{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.big{padding:20px 34px;font-size:17px}
.btn[disabled]{opacity:.55;cursor:wait}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:scale(0);animation:ripple .55s ease-out forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.small{font-size:14px;color:var(--muted)}

/* thank you */
.done-card{text-align:center;display:grid;gap:18px;justify-items:center;padding-block:30px}
.done-card h1{font-size:clamp(48px,8vw,90px)}
.done-card .stage{width:min(420px,100%);padding:24px 20px 0;display:flex;justify-content:center;align-items:flex-end;gap:6px}
.done-card .stage img{height:300px;width:auto}
.done-card .stage img+img{height:270px}
.confetti{position:fixed;pointer-events:none;z-index:80;left:0;top:0}
.confetti i{position:absolute;width:9px;height:14px;border-radius:2px;animation:conf 1.4s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:#fff;color:var(--pink);font:700 14.5px/1.3 var(--body);padding:13px 18px;border-radius:999px;box-shadow:0 14px 30px -12px rgba(40,10,20,.4);animation:in .3s}
footer{padding:20px 0 40px;text-align:center;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <span class="logo"><img src="img/l_logo.png" alt="Lovely"></span>
    <nav class="tabs" id="tabs" aria-label="Survey sections"></nav>
    <span class="count" id="count"></span>
  </div>
  <div class="prog"><i id="bar"></i></div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer>Lovely · #drinklovely · Your answers are anonymous unless you choose to leave an email.</footer>

<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------- the six shakes for the head-to-head questions ---------- */
const SHAKES = {
  swell:   {name:"Lovely",                       imgs:["img/l_sizes.webp"], size:"14oz", cal:"170", pro:"30g", sug:"4g total / 0g added", swt:"Allulose, monk fruit, stevia, a little sucralose", extra:"Collagen peptides, iron (25% DV), lactose-free"},
  alani:   {name:"Alani Nu Protein Shake",      imgs:["img/c_alani.webp"],    size:"12oz", cal:"160", pro:"30g", sug:"3g total / 2g added", swt:"Sucralose, ace-K", extra:"None"},
  vital:   {name:"Vital Proteins Collagen & Protein", imgs:["img/c_vital.webp"], size:"11oz", cal:"Not listed", pro:"30g (10g collagen)", sug:"0g added", swt:"No artificial sweeteners", extra:"10g collagen"},
  boost:   {name:"Boost Women",                 imgs:["img/c_boost.webp"],    size:"8oz",  cal:"180", pro:"15g", sug:"Not listed", swt:"Sucralose (plus carrageenan)", extra:"Iron"},
  david:   {name:"David Protein Milkshake",     imgs:["img/c_david.webp"],    size:"12oz", cal:"140–150", pro:"30g", sug:"Under 1g", swt:"Sucralose, ace-K", extra:"None"},
  fairlife:{name:"fairlife Core Power 26g",     imgs:["img/c_fairlife.webp"], size:"14oz", cal:"170", pro:"26g", sug:"5g total / 0g added", swt:"Monk fruit, stevia, ace-K, sucralose", extra:"None"}
};
const LOOK_ORDER = shuffle(Object.keys(SHAKES));
const SPEC_ORDER = shuffle(Object.keys(SHAKES));
const LETTERS = "ABCDEF";

/* ---------- countries + currency (approximate rates to USD, Nov 2026) ---------- */
const COUNTRIES = [
  ["United States","USD",1],["Canada","CAD",1.39],["Mexico","MXN",18.5],["United Kingdom","GBP",0.79],["Ireland","EUR",0.94],
  ["Germany","EUR",0.94],["France","EUR",0.94],["Spain","EUR",0.94],["Italy","EUR",0.94],["Netherlands","EUR",0.94],
  ["Australia","AUD",1.53],["New Zealand","NZD",1.69],["Indonesia","IDR",15800],["Philippines","PHP",58],["Singapore","SGD",1.34],
  ["Malaysia","MYR",4.45],["Japan","JPY",154],["South Korea","KRW",1390],["India","INR",84],["United Arab Emirates","AED",3.67],
  ["Brazil","BRL",5.7],["South Africa","ZAR",18],["Other","USD",1]
];
function cur(){ const c = COUNTRIES.find(x=>x[0]===A.country); return c ? {code:c[1], rate:c[2]} : {code:"USD", rate:1}; }
function nice(v){ if (v < 10) return Math.round(v*4)/4; if (v < 100) return Math.round(v); if (v < 1000) return Math.round(v/5)*5; const m = Math.pow(10, Math.floor(Math.log10(v))-1); return Math.round(v/m)*m; }
function money(usd){
  const {code, rate} = cur(); const v = rate===1 ? usd : nice(usd*rate);
  try { return new Intl.NumberFormat(undefined,{style:"currency",currency:code,minimumFractionDigits:v%1?2:0,maximumFractionDigits:2}).format(v); }
  catch(e){ return code+" "+v; }
}
/* swap every $ amount in a string for the respondent's currency; "$3–3.99" ranges convert both ends */
function L(str){
  if (cur().code==="USD") return str;
  return String(str).replace(/\$(\d+(?:\.\d+)?)(k)?(\+)?(?:–(\d+(?:\.\d+)?)(k)?)?/g, (m,a,k1,plus,b,k2)=> money(+a*(k1?1000:1))+(plus||"")+(b?"–"+money(+b*((k2||k1)?1000:1)).replace(symbol(),"").replace(/^[\s\u00a0]+|[\s\u00a0]+$/g,""):""));
}

/* ---------- state ---------- */
const KEY = "swell-survey-v1";
let A = {}; let step = -1; const t0 = Date.now(); let submitted = false;
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.A && !s.submitted) { A = s.A; } } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({A, submitted})); } catch(e) {} };

/* ---------- header ---------- */
const tabs = $("#tabs");
tabs.innerHTML = S.map((s,i) => `<button type="button" data-i="${i}">${esc(s.tab)}</button>`).join("");
tabs.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const i = +b.dataset.i; if (i <= maxStep) go(i); });
let maxStep = -1;
function header(){
  [...tabs.children].forEach((b,i) => { b.classList.toggle("on", i===step); b.classList.toggle("done", i<=maxStep && i!==step); b.disabled = i>maxStep; });
  const on = tabs.children[step]; if (on) on.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
  const pct = step < 0 ? 0 : submitted ? 100 : Math.round((step)/(S.length)*100);
  $("#bar").style.width = pct + "%";
  $("#count").textContent = step < 0 ? "About 5 minutes" : submitted ? "Done" : `${step+1} of ${S.length}`;
}

function optBtn(q, label, multi){
  const cur = A[q.id]; const on = multi ? Array.isArray(cur) && cur.includes(label) : cur === label;
  return `<button type="button" class="opt${multi?" multi":""}" aria-pressed="${on}" data-q="${q.id}" data-v="${esc(label)}"><span class="dot"></span><span>${esc(L(label))}</span></button>`;
}
function renderQ(q, n){
  if (q.showIf && !q.showIf(A)) return "";
  let b = "";
  const T = q.type;
  if (T==="single"||T==="multi"){
    const multi = T==="multi";
    const opts = q.other ? q.o.concat([q.otherLabel||"Other"]) : q.o;
    b = `<div class="opts${opts.length<=3?" wide":""}">${opts.map(o=>optBtn(q,o,multi)).join("")}</div>`;
    if (q.other){
      const ol = q.otherLabel||"Other"; const cur = A[q.id];
      const show = multi ? Array.isArray(cur)&&cur.includes(ol) : cur===ol;
      b += `<input type="text" class="other" data-other="${q.id}" placeholder="Tell us…" value="${esc(A[q.id+"_other"]||"")}" ${show?"":"hidden"}>`;
    }
  } else if (T==="select"){
    b = `<select class="sel" data-sel="${q.id}"><option value="">Choose…</option>${q.o.map(o=>`<option${A[q.id]===o?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
  } else if (T==="scale"){
    const st = q.start ?? 1; let bs = "";
    for (let i=st;i<st+q.n;i++) bs += `<button type="button" aria-pressed="${A[q.id]===i}" data-scale="${q.id}" data-v="${i}">${i}</button>`;
    b = `<div class="scale n${q.n}" style="--n:${q.n}">${bs}</div><div class="ends"><span>${esc(q.lo)}</span><span>${esc(q.hi)}</span></div>`;
  } else if (T==="matrix"){
    b = `<div class="mx">${q.rows.map(r=>`<div class="mrow" data-row="${r[0]}"><div><b>${esc(r[1])}</b>${r[2]?`<small>${esc(r[2])}</small>`:""}</div><div class="seg">${q.cols.map(c=>`<button type="button" aria-pressed="${A[r[0]]===c}" data-mx="${r[0]}" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div></div>`).join("")}</div>`;
  } else if (T==="text"||T==="email"){
    b = `<input type="${T==="email"?"email":"text"}" data-text="${q.id}" placeholder="${esc(q.ph||"")}" value="${esc(A[q.id]||"")}" ${T==="email"?'autocomplete="email" inputmode="email"':""}>`;
  } else if (T==="textarea"){
    b = (q.chips?`<div class="chips">${q.chips.map(c=>`<button type="button" data-chip="${q.id}">${esc(c)}</button>`).join("")}</div>`:"") + `<textarea data-text="${q.id}" placeholder="${esc(q.ph||"")}">${esc(A[q.id]||"")}</textarea>`;
  } else if (T==="money"){
    b = `<div class="money">${q.f.map(f=>`<label>${esc(f[1])}<span class="in"><span class="sym">${esc(symbol())}</span><input type="number" inputmode="decimal" min="0" step="0.25" data-text="${f[0]}" value="${esc(A[f[0]]??"")}" placeholder="0"></span></label>`).join("")}</div>`;
  } else if (T==="imgpick"){
    b = `<div class="picks">${LOOK_ORDER.map(k=>{const s=SHAKES[k];return `<button type="button" class="pick" aria-pressed="${A[q.id]===k}" data-pick="${q.id}" data-v="${k}"><span class="ck"></span><span class="pi${s.imgs.length>1?" duo":""}">${s.imgs.map(src=>`<img src="${src}" alt="" loading="lazy">`).join("")}</span><span class="pl">${esc(s.name)}</span></button>`;}).join("")}</div>`;
  } else if (T==="specpick"){
    b = `<div class="specs">${SPEC_ORDER.map((k,i)=>{const s=SHAKES[k];return `<button type="button" class="spec" aria-pressed="${A[q.id]===k}" data-pick="${q.id}" data-v="${k}"><span class="ck"></span><h4>Shake ${LETTERS[i]}</h4><dl><div><dt>Size</dt><dd>${esc(s.size)}</dd></div><div><dt>Calories</dt><dd>${esc(s.cal)}</dd></div><div><dt>Protein</dt><dd>${esc(s.pro)}</dd></div><div><dt>Sugar</dt><dd>${esc(s.sug)}</dd></div><div><dt>Sweetened with</dt><dd>${esc(s.swt)}</dd></div><div><dt>Extras</dt><dd>${esc(s.extra)}</dd></div></dl></button>`;}).join("")}</div>`;
  }
  return `<div class="q" id="q-${q.id}" data-qid="${q.id}"><div class="qt"><span class="num">${n}</span>${esc(L(q.t))}${q.req?' <span class="req" aria-label="required">*</span>':""}</div>${q.h?`<p class="qh">${esc(L(q.h))}</p>`:""}<div class="qb">${b}</div><p class="em" hidden></p></div>`;
}

      <div><p class="kick">Lovely taste panel</p><h1>Help us build the shake <em>you'd actually want.</em></h1></div>
      <p class="lead">Lovely is the protein shake you actually want to drink: premium, and it tastes like a milkshake. Before we launch, we want your honest take on the look, the taste you're after, the price, and where you'd want to grab one.</p>
      <div class="facts"><span>About 5 minutes</span><span>10 quick parts</span><span>Anonymous</span><span>Free sample for early access</span></div>
      <div class="stage"><img src="img/l_lineup.webp" alt="Lovely bottles: pink 30g and light-blue 50g in five flavors"></div>
      <div><button class="btn big" id="start" type="button">${Object.keys(A).length?"Pick up where you left off":"Start the survey"} →</button></div>
    </section>`;
    $("#start").onclick = () => go(0);
    header(); return;
  }
  const s = S[step]; let n = 0;
  const qs = s.qs.map(q => { if (q.showIf && !q.showIf(A)) return ""; n++; return renderQ(q, n); }).join("");
  app.innerHTML = `<section class="screen">
    <div class="sh"><p class="kick">${esc(s.kick)}</p><h2>${s.title}</h2><p>${esc(L(s.sub))}${s.id==="price"&&cur().code!=="USD"?` Prices are shown in ${cur().code} (approximate).`:""}</p></div>
    ${s.show?L(showcase(s.show)):""}
    <div id="qs">${qs}</div>
    <div class="navb"><button class="btn alt" type="button" id="back">← Back</button><button class="btn big" type="button" id="next">${step===S.length-1?"Submit":"Next"} →</button></div>
  </section>`;
  $("#back").onclick = () => go(step-1);
  $("#next").onclick = next;
  header();
}

/* ---------- interactions ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  ripple(b, e);
  const qid = b.dataset.q, d = b.dataset;
  if (qid){
    const q = findQ(qid); const v = d.v;
    if (q.type==="multi"){
      let cur = Array.isArray(A[qid]) ? A[qid].slice() : [];
      const exclusive = /^(Prefer not to say|None|Nowhere|None of these|I don't buy them|I don't know what most of these are|Nothing really|Not focused on it)$/.test(v);
      if (cur.includes(v)) cur = cur.filter(x=>x!==v);
      else {
        if (exclusive) cur = [v]; else cur = cur.filter(x=>!/^(Prefer not to say|None|Nowhere|None of these|I don't buy them|I don't know what most of these are|Nothing really|Not focused on it)$/.test(x));
        if (q.max && cur.length >= q.max){ toast(`Top ${q.max} only. Tap one to remove it first.`); return; }
        if (!exclusive) cur.push(v);
      }
      A[qid] = cur;
      b.closest(".opts").querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", cur.includes(x.dataset.v)));
      const ot = document.querySelector(`[data-other="${qid}"]`); if (ot) ot.hidden = !cur.includes(q.otherLabel||"Other");
    } else {
      A[qid] = v;
      b.closest(".opts").querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", x===b));
      const ot = document.querySelector(`[data-other="${qid}"]`); if (ot){ ot.hidden = v !== (q.otherLabel||"Other"); if (!ot.hidden) ot.focus(); }
      if (qid==="ambassador") rerenderKeep();
    }
    clearErr(qid); save(); return;
  }
  if (d.scale){ A[d.scale] = +d.v; b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); clearErr(d.scale); save(); return; }
  if (d.mx){ A[d.mx] = d.v; b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); b.closest(".mrow").classList.remove("miss"); const qd=b.closest(".q"); if (qd && !qd.querySelector(".mrow.miss")) clearErr(qd.dataset.qid); save(); return; }
  if (d.pick){ A[d.pick] = d.v; b.parentElement.querySelectorAll("[data-pick]").forEach(x=>x.setAttribute("aria-pressed", x===b)); clearErr(d.pick); save(); return; }
  if (d.chip){ const ta = document.querySelector(`textarea[data-text="${d.chip}"]`); const cur = ta.value.trim(); if (!cur.includes(b.textContent)){ ta.value = cur ? cur.replace(/[.\s]*$/,"") + ", " + b.textContent.toLowerCase() : b.textContent; } A[d.chip] = ta.value; clearErr(d.chip); save(); return; }
});
document.addEventListener("change", e => {
  const t = e.target; if (!t.dataset.sel) return;
  A[t.dataset.sel] = t.value; save(); if (t.dataset.sel==="country") rerenderKeep(); else clearErr(t.dataset.sel);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.text){ A[t.dataset.text] = t.type==="number" ? (t.value===""?"":+t.value) : t.value; const qd=t.closest(".q"); if (qd) clearErr(qd.dataset.qid); save(); }
  if (t.dataset.other){ A[t.dataset.other+"_other"] = t.value; save(); }
});
function findQ(id){ for (const s of S) for (const q of s.qs) if (q.id===id) return q; }
function rerenderKeep(){ const y = scrollY; render(); scrollTo(0,y); }
function clearErr(id){ const el = document.getElementById("q-"+id); if (!el) return; el.classList.remove("err"); const m = el.querySelector(".em"); if (m) m.hidden = true; }

function missing(q){
  if (!q.req || (q.showIf && !q.showIf(A))) return null;
  const v = A[q.id];
  if (q.type==="multi") return Array.isArray(v)&&v.length ? null : "Pick at least one.";
  if (q.type==="matrix") return q.rows.every(r=>A[r[0]]) ? null : "Answer every row.";
  if (q.type==="money"){ const vals = q.f.map(f=>A[f[0]]); return vals.every(x=>x!==""&&x!=null&&!isNaN(x)) ? null : "Fill in all four prices."; }
  if (q.type==="text"||q.type==="textarea") return v && String(v).trim() ? null : "Add a quick answer.";
  return v!==undefined && v!=="" ? null : "Pick one.";
}
function next(){
  const s = S[step]; let first = null;
  for (const q of s.qs){
    const m = missing(q); const el = document.getElementById("q-"+q.id); if (!el) continue;
    if (m){ el.classList.add("err"); const em = el.querySelector(".em"); em.textContent = m; em.hidden = false; if (q.type==="matrix") q.rows.forEach(r=>{ if(!A[r[0]]) el.querySelector(`[data-row="${r[0]}"]`).classList.add("miss"); }); first = first || el; }
  }
  if (first){ first.scrollIntoView({behavior:"smooth",block:"center"}); toast("A few answers are missing."); return; }
  if (step === S.length-1) return submit();
  go(step+1);
}
function go(i){ step = Math.max(-1, Math.min(S.length-1, i)); maxStep = Math.max(maxStep, step); render(); scrollTo(0,0); }

/* ---------- submit ---------- */
function flatten(){
  const row = {submitted_at:new Date().toISOString(), seconds:Math.round((Date.now()-t0)/1000), look_order:LOOK_ORDER.join(" "), label_order:SPEC_ORDER.map((k,i)=>LETTERS[i]+"="+k).join(" ")};
  for (const s of S) for (const q of s.qs){
    if (q.type==="matrix") q.rows.forEach(r=>row[r[0]] = A[r[0]]||"");
    else if (q.type==="money") q.f.forEach(f=>row[f[0]] = A[f[0]]??"");
    else if (q.type==="imgpick"||q.type==="specpick") row[q.id] = A[q.id] ? SHAKES[A[q.id]].name : "";
    else { const v = A[q.id]; row[q.id] = Array.isArray(v) ? v.join("; ") : (v ?? ""); if (q.other) row[q.id+"_other"] = A[q.id+"_other"]||""; }
  }
  const c = cur(); row.currency = c.code;
  for (const s of S) for (const q of s.qs) if (q.type==="money") q.f.forEach(f=>{ const v = A[f[0]]; row[f[0]+"_usd"] = (v===""||v==null) ? "" : Math.round(v/c.rate*100)/100; });
  return row;
}
async function submit(){
  const btn = $("#next"); btn.disabled = true; btn.textContent = "Sending…";
  const row = flatten(); const url = (window.SWELL_ENDPOINT||"").trim();
  let ok = true;
  if (url){
    try { await fetch(url, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(row)}); }
    catch(e){ ok = false; }
  }
  if (!ok){ btn.disabled = false; btn.textContent = "Submit →"; toast("Couldn't send. Check your connection and tap Submit again."); return; }
  submitted = true; window.__swellPreview = !url; save(); try { localStorage.removeItem(KEY); } catch(e) {}
  render(); confetti();
}
function renderDone(){
  $("#app").innerHTML = `<section class="screen done-card">
    <p class="kick">All done</p><h1>Thank you, <em>truly.</em></h1>
    <p class="lead" style="color:var(--muted);max-width:30em">Your answers go straight into how Lovely looks, tastes and gets to you. ${A.email?"We'll email you when early access opens.":""}</p>
    <div class="stage"><img src="img/l_sizes.webp" alt=""></div>
    ${window.__swellPreview?'<p class="small">Preview mode: this response was not recorded. Connect the Google Sheet to start collecting.</p>':""}
  </section>`;
  header();
}

/* ---------- feel ---------- */
function ripple(b, e){
  if (!b.classList.contains("btn")) return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height)*2, i = document.createElement("span");
  i.className = "ripple"; i.style.cssText = `width:${s}px;height:${s}px;left:${(e.clientX||r.left+r.width/2)-r.left-s/2}px;top:${(e.clientY||r.top+r.height/2)-r.top-s/2}px`;
  b.appendChild(i); setTimeout(()=>i.remove(), 600);
}
function confetti(){
  const c = document.createElement("div"); c.className = "confetti"; c.style.left = innerWidth/2+"px"; c.style.top = innerHeight/3+"px";
  const cols = ["#fff","#c9577f","#b9cdee","#f7d6e2","#7d4558"];
  for (let i=0;i<70;i++){ const p = document.createElement("i"); const a = Math.random()*Math.PI*2, d = 140+Math.random()*320;
    p.style.cssText = `background:${cols[i%cols.length]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d+200}px;--r:${Math.random()*720-360}deg`; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(()=>c.remove(), 1600);
}
let tt; function toast(m){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const t = document.createElement("div"); t.className="toast"; t.role="status"; t.textContent=m; document.body.appendChild(t); clearTimeout(tt); tt=setTimeout(()=>t.remove(), 2600); }

render();
})();
</script>
</body>
